[theme]
primaryColor = "#58a6ff"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#c9d1d9"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 50
enableCORS = false
enableXsrfProtection = true

[runner]
magicEnabled = false

[client]
# Reducir animación del spinner para que la recarga se sienta más rápida
showErrorDetails = true
toolbarMode = "minimal"